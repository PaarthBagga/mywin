# Local Postgres for development. Start with `docker compose up -d`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mywin
      POSTGRES_PASSWORD: mywin
      POSTGRES_DB: mywin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
